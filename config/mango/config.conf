# Omarchy for Mango — user configuration
#
# Mango reads this file by default. Everything below is layered in order:
# Omarchy defaults first, then the generated theme, then your own files.
# Edit the files in ~/.config/mango/ rather than this file where possible.

source=~/.local/share/omarchy/default/mango/envs.conf
source=~/.local/share/omarchy/default/mango/looknfeel.conf
source=~/.local/share/omarchy/default/mango/input.conf
source=~/.local/share/omarchy/default/mango/windows.conf
source=~/.local/share/omarchy/default/mango/autostart.conf

# Generated by `omarchy-theme-set` (colours only)
source_optional=~/.config/omarchy/current/theme/mango.conf

# Your own files. The installer copies the defaults here, so they are full
# configs: sourcing the matching default again would duplicate every binding.
source_optional=~/.config/mango/monitors.conf
source_optional=~/.config/mango/input.conf
source_optional=~/.config/mango/bindings.conf
source_optional=~/.config/mango/looknfeel.conf
source_optional=~/.config/mango/autostart.conf

# Persistent toggles written by Omarchy commands. Mango does not expand
# globs in source paths, so every toggle file is listed here explicitly.
source_optional=~/.local/state/omarchy/toggles/mango/window-gaps.conf
source_optional=~/.local/state/omarchy/toggles/mango/window-transparency.conf
source_optional=~/.local/state/omarchy/toggles/mango/window-single-aspect.conf
source_optional=~/.local/state/omarchy/toggles/mango/touchpad-disabled.conf
source_optional=~/.local/state/omarchy/toggles/mango/touchscreen-disabled.conf

# Add any other personal Mango configuration below.
