# Your Mango monitor overrides.
#
# Rules are evaluated top to bottom and the first match wins. Mango's
# `omarchy-mango-monitor-scaling-cycle` and `omarchy-mango-monitor-internal`
# commands append their own rules here.
#
# Examples:
# monitor_rule=name:^eDP-1$,scale:1.25
# monitor_rule=name:^DP-1$,width:2560,height:1440,refresh:144,scale:1
# monitor_rule=name:^HDMI-A-1$,x:1920,y:0,scale:1
