# Omarchy key bindings — Mango
# Edit ~/.config/mango/bindings.conf to add your own.
#
# Mango uses xev/wev key names. Modifiers are joined with '+'.
# Dispatchers are documented at https://github.com/mangowm/mango/wiki/keys

# ---- Reload / overview ----------------------------------------------------
bind=SUPER,r,reload_config
bind=SUPER,grave,toggleoverview
bind=SUPER+SHIFT+ALT,q,quit

# ---- Applications ---------------------------------------------------------
bind=SUPER,Return,spawn_shell,xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bind=SUPER+ALT,Return,spawn_shell,xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bind=SUPER+SHIFT,Return,spawn,omarchy-launch-browser
bind=SUPER+SHIFT,f,spawn,nemo --new-window
bind=SUPER+ALT+SHIFT,f,spawn_shell,nemo --new-window "$(omarchy-cmd-terminal-cwd)"
bind=SUPER+SHIFT,b,spawn,omarchy-launch-browser
bind=SUPER+SHIFT+ALT,b,spawn,omarchy-launch-browser --private

bind=SUPER+SHIFT,m,spawn,omarchy-launch-or-focus spotify
bind=SUPER+SHIFT+ALT,m,spawn,omarchy-launch-or-focus-tui cliamp
bind=SUPER+SHIFT,n,spawn,omarchy-launch-editor
bind=SUPER+SHIFT,d,spawn,omarchy-launch-tui lazydocker
bind=SUPER+SHIFT,g,spawn_shell,omarchy-launch-or-focus '^signal$' 'signal-desktop'
bind=SUPER+SHIFT,o,spawn_shell,omarchy-launch-or-focus '^obsidian$' obsidian
bind=SUPER+SHIFT,w,spawn,typora --enable-wayland-ime
bind=SUPER+SHIFT,slash,spawn,1password

# Web apps
bind=SUPER+SHIFT,a,spawn,omarchy-launch-webapp https://chatgpt.com
bind=SUPER+SHIFT+ALT,a,spawn,omarchy-launch-webapp https://grok.com
bind=SUPER+SHIFT,c,spawn,omarchy-launch-webapp https://app.hey.com/calendar/weeks/
bind=SUPER+SHIFT,e,spawn,omarchy-launch-webapp https://app.hey.com
bind=SUPER+SHIFT,y,spawn,omarchy-launch-webapp https://youtube.com/
bind=SUPER+SHIFT+ALT,g,spawn_shell,omarchy-launch-or-focus-webapp WhatsApp https://web.whatsapp.com/
bind=SUPER+SHIFT+CTRL,g,spawn_shell,omarchy-launch-or-focus-webapp 'Google Messages' https://messages.google.com/web/conversations
bind=SUPER+SHIFT,p,spawn_shell,omarchy-launch-or-focus-webapp 'Google Photos' https://photos.google.com/
bind=SUPER+SHIFT,x,spawn,omarchy-launch-webapp https://x.com/
bind=SUPER+SHIFT+ALT,x,spawn,omarchy-launch-webapp https://x.com/compose/post

# ---- Window management ----------------------------------------------------
bind=SUPER,w,killclient
bind=CTRL+ALT,Delete,spawn,omarchy-mango-window-close-all
bind=SUPER,j,dwindle_toggle_split_direction
bind=SUPER,t,togglefloating
bind=SUPER,f,togglefullscreen
bind=SUPER+CTRL,f,togglemaximizescreen
bind=SUPER+ALT,f,togglemaximizescreen
bind=SUPER,o,spawn,omarchy-mango-window-pop
bind=SUPER,l,spawn,omarchy-mango-workspace-layout-toggle

# Focus
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# Tags 1-9 and 0 (tag 10)
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER,0,view,10

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
bind=SUPER+SHIFT,0,tag,10

bind=SUPER+SHIFT+ALT,1,tagsilent,1
bind=SUPER+SHIFT+ALT,2,tagsilent,2
bind=SUPER+SHIFT+ALT,3,tagsilent,3
bind=SUPER+SHIFT+ALT,4,tagsilent,4
bind=SUPER+SHIFT+ALT,5,tagsilent,5
bind=SUPER+SHIFT+ALT,6,tagsilent,6
bind=SUPER+SHIFT+ALT,7,tagsilent,7
bind=SUPER+SHIFT+ALT,8,tagsilent,8
bind=SUPER+SHIFT+ALT,9,tagsilent,9
bind=SUPER+SHIFT+ALT,0,tagsilent,10

# Scratchpad / special overlay
bind=SUPER,s,toggle_special_tag
bind=SUPER+ALT,s,tag_special_tag

# Tag navigation
bind=SUPER,Tab,viewtoright
bind=SUPER+SHIFT,Tab,viewtoleft
bind=SUPER+CTRL,Tab,view,-1

# Swap windows
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

# Cycle windows
bind=ALT,Tab,focusstack,next
bind=ALT+SHIFT,Tab,focusstack,prev

# Cycle monitors
bind=CTRL+ALT,Tab,focusmon,next
bind=CTRL+ALT+SHIFT,Tab,focusmon,prev

# Resize
bind=SUPER,minus,resizewin,-100,0
bind=SUPER,equal,resizewin,+100,0
bind=SUPER+SHIFT,minus,resizewin,0,-100
bind=SUPER+SHIFT,equal,resizewin,0,+100

# Scroll through tags
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Drag to move / resize
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Groups
bind=SUPER+ALT,Left,groupjoin,left
bind=SUPER+ALT,Right,groupjoin,right
bind=SUPER+ALT,Up,groupjoin,up
bind=SUPER+ALT,Down,groupjoin,down
bind=SUPER+ALT,g,groupleave
bind=SUPER+ALT,Tab,groupfocus,next
bind=SUPER+ALT+SHIFT,Tab,groupfocus,prev
bind=SUPER+CTRL,Left,groupfocus,prev
bind=SUPER+CTRL,Right,groupfocus,next
bind=SUPER+CTRL,Up,groupfocus,prev
bind=SUPER+CTRL,Down,groupfocus,next

# Monitor scaling
bind=SUPER,slash,spawn,omarchy-mango-monitor-scaling-cycle
bind=SUPER+ALT,slash,spawn,omarchy-mango-monitor-scaling-cycle --reverse

# ---- Clipboard ------------------------------------------------------------
bind=SUPER,c,spawn,wtype -M ctrl -k Insert -m ctrl
bind=SUPER,v,spawn,wtype -M shift -k Insert -m shift
bind=SUPER,x,spawn,wtype -M ctrl -k x -m ctrl
bind=SUPER+CTRL,v,spawn,omarchy-menu-clipboard

# ---- Menus ----------------------------------------------------------------
bind=SUPER,space,spawn,omarchy-menu
bind=SUPER+CTRL,e,spawn,omarchy-menu-emoji
bind=SUPER+CTRL,c,spawn,omarchy-menu toggle capture
bind=SUPER+CTRL,o,spawn,omarchy-menu toggle toggle
bind=SUPER+CTRL,h,spawn,omarchy-menu toggle hardware
bind=SUPER+ALT,space,spawn,omarchy-menu
bind=SUPER+SHIFT,code:201,spawn,omarchy-menu
bind=SUPER,Escape,spawn,omarchy-menu toggle system
bindl=NONE,XF86PowerOff,spawn,omarchy-menu toggle system
bind=SUPER,k,spawn,omarchy-menu-keybindings
bind=NONE,XF86Calculator,spawn,gnome-calculator

# ---- Aesthetics -----------------------------------------------------------
bind=SUPER+SHIFT,space,spawn,omarchy-toggle-bar
bind=SUPER+CTRL,space,spawn,omarchy-menu toggle background
bind=SUPER+SHIFT+CTRL,space,spawn,omarchy-menu toggle theme
bind=SUPER,BackSpace,spawn,omarchy-mango-window-transparency-toggle
bind=SUPER+SHIFT,BackSpace,spawn,omarchy-mango-window-gaps-toggle
bind=SUPER+CTRL,BackSpace,spawn,omarchy-mango-window-single-square-aspect-toggle

# ---- Notifications --------------------------------------------------------
bind=SUPER,comma,spawn,omarchy-notification-action dismiss
bind=SUPER+SHIFT,comma,spawn,omarchy-notification-action dismiss-all
bind=SUPER+CTRL,comma,spawn,omarchy-notification-action toggle-dnd
bind=SUPER+ALT,comma,spawn,omarchy-notification-action invoke
bind=SUPER+SHIFT+ALT,comma,spawn,omarchy-notification-action history

# ---- Toggles --------------------------------------------------------------
bind=SUPER+CTRL,i,spawn,omarchy-toggle-idle
bind=SUPER+CTRL,n,spawn,omarchy-toggle-nightlight
bind=SUPER+CTRL,Delete,spawn,omarchy-mango-monitor-internal toggle
bind=SUPER+CTRL+ALT,Delete,spawn,omarchy-mango-monitor-internal-mirror toggle

# ---- Captures -------------------------------------------------------------
bind=NONE,Print,spawn,omarchy-capture-screenshot
bind=ALT,Print,spawn,omarchy-menu toggle screenrecord
bind=SUPER,Print,spawn,omarchy-mango-color-picker
bind=SUPER+CTRL,Print,spawn,omarchy-capture-text-extraction

# ---- Sharing / tools ------------------------------------------------------
bind=SUPER+CTRL,s,spawn,omarchy-menu toggle share
bind=SUPER+CTRL,period,spawn,omarchy-transcode
bind=SUPER+CTRL,r,spawn,omarchy-menu toggle reminder-set
bind=SUPER+CTRL+ALT,r,spawn,omarchy-reminder show
bind=SUPER+SHIFT+CTRL,r,spawn,omarchy-reminder clear

# ---- Information ----------------------------------------------------------
bind=SUPER+CTRL+ALT,t,spawn_shell,notify-send -u low "󰥔    $(date +'%A %H:%M  ·  %d %B %Y  ·  Week %V')"
bind=SUPER+CTRL+ALT,b,spawn_shell,notify-send -u low "$(omarchy-battery-status)"
bind=SUPER+CTRL+ALT,w,spawn_shell,notify-send -u low "$(omarchy-weather-status)"

# ---- Control panels -------------------------------------------------------
# Multi-token commands need spawn_shell: spawn execs the whole string as one
# program name, so the agent keybinding rides the shell dispatcher.
bind=SUPER+SHIFT+CTRL,a,spawn_shell,omarchy-agent --pick
bind=SUPER+CTRL,a,spawn,omarchy-launch-audio
bind=SUPER+CTRL,b,spawn,omarchy-launch-bluetooth
bind=SUPER+CTRL,w,spawn,omarchy-launch-wifi
bind=SUPER+CTRL,t,spawn,omarchy-launch-tui btop

# ---- Lock ----------------------------------------------------------------
bind=SUPER+CTRL,l,spawn,omarchy-system-lock

# ---- Media keys ----------------------------------------------------------
bindl=NONE,XF86AudioRaiseVolume,spawn,omarchy-audio-output-volume raise
bindl=NONE,XF86AudioLowerVolume,spawn,omarchy-audio-output-volume lower
bindl=NONE,XF86AudioMute,spawn,omarchy-audio-output-volume mute-toggle
bindl=NONE,XF86AudioMicMute,spawn,omarchy-audio-input-mute
bindl=NONE,XF86MonBrightnessUp,spawn,omarchy-brightness-display +5%
bindl=NONE,XF86MonBrightnessDown,spawn,omarchy-brightness-display 5%-
bindl=SHIFT,XF86MonBrightnessUp,spawn,omarchy-brightness-display 100%
bindl=SHIFT,XF86MonBrightnessDown,spawn,omarchy-brightness-display 1%
bindl=NONE,XF86KbdBrightnessUp,spawn,omarchy-brightness-keyboard up
bindl=NONE,XF86KbdBrightnessDown,spawn,omarchy-brightness-keyboard down

bindl=ALT,XF86AudioRaiseVolume,spawn,omarchy-audio-output-volume +1
bindl=ALT,XF86AudioLowerVolume,spawn,omarchy-audio-output-volume -1
bindl=ALT,XF86MonBrightnessUp,spawn,omarchy-brightness-display +1%
bindl=ALT,XF86MonBrightnessDown,spawn,omarchy-brightness-display 1%-

bindl=NONE,XF86AudioNext,spawn,omarchy-media-key next
# Mango treats XF86AudioPause and XF86AudioPlay as the same binding, so only
# bind one of them. Most keyboards send XF86AudioPlay.
bindl=NONE,XF86AudioPlay,spawn,omarchy-media-key play-pause
bindl=NONE,XF86AudioPrev,spawn,omarchy-media-key previous
bindl=SUPER,XF86AudioMute,spawn,omarchy-audio-output-switch

# ---- Optional Omarchy extras ---------------------------------------------
# Dictation (install voxtype first: https://github.com/peteonrails/voxtype)
# bind=SUPER+CTRL,x,spawn,voxtype record toggle
# bind=NONE,F9,spawn,voxtype record start
# bindr=NONE,F9,spawn,voxtype record stop

# Laptop lid switch events are not exposed by Mango. Use the Omarchy menu or
# Super+Ctrl+Delete to toggle the internal display instead.
