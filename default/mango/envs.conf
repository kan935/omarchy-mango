# Omarchy environment — Mango
# Values are applied when Mango starts and re-applied on reload.

# Cursor
env=XCURSOR_SIZE,24

# Wayland-first applications
env=GDK_BACKEND,wayland,x11,*
env=QT_QPA_PLATFORM,wayland;xcb
env=MOZ_ENABLE_WAYLAND,1
env=ELECTRON_OZONE_PLATFORM_HINT,wayland
env=OZONE_PLATFORM,wayland
env=XDG_SESSION_TYPE,wayland
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_DESKTOP,mango

# Input method (fcitx5 is installed by install-fedora.sh)
# GTK uses the Wayland input-method protocol; forcing GTK_IM_MODULE=fcitx
# makes fcitx5 warn and breaks candidate windows on Wayland.
env=QT_IM_MODULE,fcitx
env=QT_IM_MODULES,wayland;fcitx
env=SDL_IM_MODULE,fcitx
env=XMODIFIERS,@im=fcitx

# XCompose
env=XCOMPOSEFILE,~/.XCompose

# Keep XWayland applications on integer scale
xwayland_ignore_scale=0

# Do not force GDK_SCALE here. Set it in ~/.config/mango/monitors.conf if you
# run a HiDPI display, for example:
# env=GDK_SCALE,2
