# Omarchy input defaults — Mango
# Edit ~/.config/mango/input.conf instead of this file.

# Keyboard
xkb_rules_layout=us
# xkb_rules_variant=intl
xkb_rules_options=compose:caps
repeat_rate=40
repeat_delay=250
numlock_on=1

# Pointer
mouse_natural_scrolling=0
mouse_accel_profile=2
mouse_accel_speed=0

# Trackpad
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_click_method=2
trackpad_scroll_factor=0.4
trackpad_left_handed=0

# Touchpad gestures (Mango's native gestures)
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview

# Example: override a single device
# device_rule=name:ELAN Touchscreen,send_events_mode:1
