# Omarchy look and feel — Mango defaults
# Edit ~/.config/mango/looknfeel.conf instead of this file.

# ---- Layout ---------------------------------------------------------------
tag_num=10
circle_layout=dwindle,scroller,tile

# Omarchy uses dwindle by default, with a scrolling alternative.
tag_rule=id:*,layout_name:dwindle

new_is_master=1
default_master_factor=0.55
default_master_count=1

dwindle_preserve_split=1
dwindle_smart_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_drop_simple_split=1

scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=0
scroller_proportion_preset=0.5,0.8,1.0

monocle_tab_mode=1
monocle_no_border=0
monocle_no_gap=0

# ---- Gaps, borders, corners ----------------------------------------------
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
smart_gaps=0

border_px=2
border_radius=0
no_radius_when_single=0
no_border_when_single=0

# Colours are replaced by ~/.config/omarchy/current/theme/mango.conf.
root_color=0x1a1b26ff
border_color=0x32344aff
focus_color=0x7aa2f7ff
urgent_color=0xf7768eff

maximized_screen_color=0x9ece6aff
scratchpad_color=0x7aa2f7ff
global_color=0xad8ee6ff
overlay_color=0x449dabff

# ---- Effects --------------------------------------------------------------
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=1
blur_params_radius=2
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

shadows=1
layer_shadows=0
shadow_only_floating=1
shadows_size=2
shadows_blur=3
shadows_position_x=0
shadows_position_y=0
shadows_color=0x1a1a1aee

focused_opacity=0.97
unfocused_opacity=0.9
dim_enable=0

# ---- Animations -----------------------------------------------------------
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.9
zoom_end_ratio=1.0
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8

animation_duration_move=300
animation_duration_open=300
animation_duration_tag=300
animation_duration_close=250
animation_duration_focus=150

animation_curve_open=0.23,1,0.32,1
animation_curve_move=0.23,1,0.32,1
animation_curve_tag=0.23,1,0.32,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.23,1,0.32,1
animation_curve_opacity_fade_in=0.23,1,0.32,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5

# ---- Focus and system -----------------------------------------------------
focus_on_activate=1
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
exchange_cross_monitor=0
enable_floating_snap=0
allow_tearing=1

# Layer surfaces: keep bars/launchers crisp and quick.
layer_rule=no_animation:1,layer_name:waybar
layer_rule=no_animation:1,no_blur:1,layer_name:selection
layer_rule=animation_type_open:slide,animation_type_close:fade,layer_name:walker
layer_rule=no_animation:1,no_shadow:1,layer_name:mako
