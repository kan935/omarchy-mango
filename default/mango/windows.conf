# Omarchy window rules — Mango
# Format: window_rule=parameter:value,...,app_id:regex
# Mango matches app_id and title with regular expressions.

# ---- Media players and viewers: no transparency ---------------------------
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,app_id:^(mpv|imv|vlc|zoom|org\.kde\.kdenlive|com\.obsproject\.Studio|com\.github\.PintaProject\.Pinta|org\.gnome\.NautilusPreviewer)$
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,app_id:^(qemu|com\.libretro\.RetroArch)$

# ---- Floating dialogs and utilities --------------------------------------
window_rule=is_floating:1,width:875,height:600,app_id:^(org\.omarchy\..*|org\.gnome\.NautilusPreviewer|org\.gnome\.Evince|com\.gabm\.satty|Omarchy|About|TUI\.float|imv|mpv)$
# The coding agent keeps the shared agent app-id but must not float: run as a
# full (fullscreen) window instead of the floating org.omarchy.* box.
window_rule=is_floating:0,is_fullscreen:1,app_id:^org\.omarchy\.agent$
window_rule=is_floating:1,app_id:^org\.gnome\.Calculator$
window_rule=is_floating:1,width:1100,height:700,app_id:^(Share|localsend)$
window_rule=is_floating:1,app_id:^Typora$,title:^Print$
window_rule=is_floating:1,width:1100,height:700,app_id:^steam$,title:^Steam$
window_rule=is_floating:1,width:460,height:800,app_id:^steam$,title:^Friends List$

# App launcher / password managers float above the tiling layout
window_rule=is_floating:1,app_id:^(1[Pp]assword|Bitwarden)$

# ---- Picture in picture ---------------------------------------------------
window_rule=is_floating:1,is_global:1,no_border:1,width:600,height:338,offset_x:88,offset_y:-42,title:(Picture.?in.?[Pp]icture)

# ---- Screen recording webcam overlay -------------------------------------
# ffplay sets the window title but not an app_id.
window_rule=is_floating:1,is_global:1,is_open_silent:1,offset_x:88,offset_y:-88,app_id:^(WebcamOverlay|[Ww]ebcam.*)$
window_rule=is_floating:1,is_global:1,is_open_silent:1,offset_x:88,offset_y:-88,title:^WebcamOverlay$

# ---- Omarchy screensaver --------------------------------------------------
window_rule=is_fullscreen:1,is_floating:1,app_id:^org\.omarchy\.screensaver$

# ---- Games ----------------------------------------------------------------
window_rule=is_fullscreen:1,app_id:^com\.libretro\.RetroArch$
window_rule=is_fullscreen:1,app_id:^com\.moonlight_stream\.Moonlight$
window_rule=is_fullscreen:1,app_id:^GeForceNOW$

# ---- Browser app windows ---------------------------------------------------
# Chromium web apps should still tile; nothing special is required. Keep the
# rule here so users have an obvious place to add per-site tweaks.
